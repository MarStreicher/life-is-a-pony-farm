colorScheme = "ponyfarm"
defaultAppearance = "light"
autoSwitchAppearance = false

enableSearch = true

[header]
  layout = "floating"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing"
  showRecent = true
  showRecentItems = 4
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true
  cardViewScreenWidth = true

[article]
  showDate = true
  showAuthor = false
  showHero = true
  heroStyle = "big"
  showReadingTime = true
  showTaxonomies = true
  showWordCount = false

[list]
  showSummary = true
  showCards = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = true
